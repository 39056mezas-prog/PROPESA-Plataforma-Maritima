function go(s){const[v,...r]=s.split(':');if(v!==V.v)HIST={};V={v,id:r.join(':')};ND=null;evc=null;msg='';form=null;conf=null;uf=null;render();document.querySelector('main').scrollTop=0}
const g=i=>document.getElementById(i).value;
function mv(){const ty=g('ty'),s=g('sz'),k=+g('kg'),l=V.id;if(!(k>0))return fail('Ingresa una cantidad mayor a 0.','kg');
 const d=Math.round((ty=='RECEPCION'?k:-k)*1000);if(bal(l,s)+d<0)return fail(`Existencia insuficiente: hay ${f(bal(l,s))} kg en ${s}.`,'kg');
 post(ty,l,s,d/1000);save();msg=`✔ ${ty.replace('_',' ')} registrado: ${d>0?'+':''}${f(d)} kg en ${s}.`;render()}
function rev(id){const x=ST.L.find(y=>y.id===id);if(!x||x.type==='REVERSA'||rvd().has(id))return;if(bal(x.lot,x.size)-x.m<0){msg='No se puede revertir: dejaría existencia negativa.';return render()}post('REVERSA',x.lot,x.size,-x.m/1000,id);save();msg=`✔ Movimiento #${mvNo(id)} revertido.`;render()}
function delLot(){const l=V.id;if(ST.B[l].some(b=>b.d!=null)){conf=null;toast('No se puede eliminar: tiene cajas empacadas para envíos.');return render()}
 ST.R=ST.R.filter(r=>r.lot!==l);delete ST.B[l];ST.L=ST.L.filter(x=>x.lot!==l);save();conf=null;toast('Lote eliminado');go('recepcion')}
function closeLot(l){const r=R_(l),c=calc(l);if(!c)return toast('Captura primero el conteo final.');r.closed=true;save();toast(`✔ Lote cerrado. Mortalidad calculada: ${f(c.dead)} kg (${c.p.toFixed(2)}%).`);render()}
function closeP(i){const p=ST.P[i],bad=[];for(const l in ST.B)ST.B[l].forEach((b,n)=>{if(b.d===i&&!(b.c>0&&b.k))bad.push(`${l} #${n+1}`)});
 if(bad.length)return toast('Faltan datos en cajas: '+bad.slice(0,4).join(', '));if(!boxesOf(i).length)return toast('Empaca cajas para este envío antes de cerrar.');
 p.closed=true;const x=boxesOf(i),by={R:0,V:0,B:0,A:0};x.forEach(o=>by[o.b.k]+=o.b.c);const to=ST.U.filter(u=>u.notify).map(u=>u.email);
 const body=`Empaque cerrado: ${p.n}\nFecha: ${now()}\nCerrado por: ${me.name}\n\nÓrdenes de empaque: ${[...new Set(shipLinks(i).map(z=>fd(z.o.etd)))].join(', ')}\nHieleras: ${p.h}\nPeso bruto: ${gross(p).toFixed(1)} kg\nLotes: ${[...new Set(x.map(o=>o.l))].join(', ')}\nCajas empacadas: ${x.length}\nLangostas: ${sent(i)} (Rojo ${by.R} · Verde ${by.V} · Blanco ${by.B})\n\nDetalle por caja:\n`+x.map(o=>`  ${o.l}: ${o.b.c} piezas ${RC[o.b.k][0]}`).join('\n');
 const pdfn=pdfName('Embarque',p.n);ST.O.unshift({u:uidS(),subject:`[PROPESA] Informe de empaque ${p.n}`,t:now(),to,body:body+`\n\nAdjunto: ${pdfn}`,pn:p.n,att:pdfn});save();toast('✔ Empaque cerrado. Manda el informe con «Enviar por correo».');render()}
async function saveUCloud(n,e,pw,r,nt,isNew){const b=document.querySelector('[data-a=su]');if(b)b.disabled=true;

 if(ST.U.some(u=>String(u.email).toLowerCase()==e.toLowerCase()&&u.id!=uf.id))return fail('Ese correo ya existe.','ue');

 if(!isNew){const u=ST.U.find(u=>u.id==uf.id);if(u.role=='admin'&&r!='admin'&&ST.U.filter(x=>x.role=='admin').length<2)return fail('Debe quedar al menos un Administrador.','ur');Object.assign(u,{name:n,email:e,role:r,notify:nt})}

  if(k=='cl')return closeLot(x.dataset.lot||V.id);if(k=='ol'){R_(V.id).closed=false;save();return render()}
  
  if(k=='cp')return closeP(+V.id);if(k=='op'){ST.P[+V.id].closed=false;save();return render()}
