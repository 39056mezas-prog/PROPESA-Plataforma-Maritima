   lo que se acaba de subir (antes salía con el «antes» viejo y la base lo rechazaba con un aviso falso).
   Si la base lo rechaza pero tiene lo mismo, solo escrito distinto (un registro viejo que WN arregló al bajarlo), no es un
   choque: se vuelve a subir una vez contra lo que hay de verdad en la base, y así queda arreglado también allá.
   shortcut: si el envío se corta después de guardar y el registro se vuelve a cambiar antes de reintentar, el reintento choca y gana la base; es raro. */

 for(let pass=0,redo=null;pass<2;pass++){const ks=redo||Object.keys(OUT);redo=[];let i=0;

  while(i<ks.length&&(!batch.length||(sz<1.5e6&&batch.length<500))){const k=ks[i++],s=OUT[k];if(s==null)continue;const r={k,v:JSON.parse(s)},b=hasOwn(OUTB,k)?OUTB[k]:undefined;
   if(b!==undefined)r.b=b==null?null:JSON.parse(b);batch.push(r);sent.push([k,s,b]);sz+=s.length+k.length+(b||'').length}
  if(!batch.length)continue;
  const l=await sbPost('/rest/v1/rpc/push',{rows:batch});/* v1.6.0: ya no hay camino que suba sin revisar choques; si push falla, se marca error y se reintenta */
  const lk=new Map();(Array.isArray(l)?l:[]).forEach(x=>{if(x&&typeof x.k=='string')lk.set(x.k,x)});
  sent.forEach(([k,s,b])=>{const x=lk.get(k);
   if(x&&!pass&&b!==undefined&&x.v!=null&&typeof x.v=='object'){const n=wnorm(k,x.v);if(n&&JSON.stringify(n)===b){
    lk.delete(k);if(!hasOwn(OUT,k))OUT[k]=s;OUTB[k]=JSON.stringify(x.v);redo.push(k);return}}
   if(OUT[k]===s){delete OUT[k];delete OUTB[k]}
   else if(!x){if(hasOwn(OUT,k))OUTB[k]=s==='null'?null:s}
   else{delete OUT[k];delete OUTB[k]}});// choque de verdad: gana la base también sobre lo que se cambió mientras tanto

 ST.R.forEach(r=>{const t=lotOld(r.lot);if(t)o.push({ti:'Lote con muchos días · '+E(r.lot),tx:E(t),go:'lote:'+E(r.lot)})});
 ST.R.forEach(r=>{const w=lotWarn(r);if(w.length)o.push({ti:'Revisar entrada · '+E(r.lot),tx:E(w.map(x=>x.t).join(' · ')),go:'lote:'+E(r.lot)})});
 const pl={},PL=pendLines();PL.forEach(({o:q,l,n})=>{pl[q.id]=pl[q.id]||{q,f:0};pl[q.id].f+=l.boxes-n});
 ST.OR.forEach(q=>{if(!q.lines.length)o.push({ti:'Orden del '+fd(q.etd),tx:'Faltan las líneas: cliente final y hieleras.',go:'orden:'+q.id});
  else if(pl[q.id])o.push({ti:'Orden del '+fd(q.etd),tx:`Faltan ${hie(pl[q.id].f)} por empacar.`,go:(can('box')&&goPend(q))||'orden:'+q.id})});
 ST.P.forEach((p,i)=>{if(p.closed&&!p.sf)return;const is=shipIssues(i).filter(x=>!/^No hay hieleras empacadas/.test(x.t));/* eso ya sale en su orden */
  is.forEach(x=>o.push({ti:'Embarque '+E(p.n),tx:x.t,go:x.go||'emb:'+i,jump:x.jump}));
  if(!p.closed&&!is.length&&boxesOf(i).length&&!PL.some(z=>(z.o.sh||{})[z.l.city+'|'+z.l.cons]===i))o.push({ti:'Embarque '+E(p.n),tx:'Ya está empacado: revísalo y ciérralo para mandar el informe.',go:'emb:'+i})});
 return o}

 ST.OR.forEach(q=>{const t=msN(q.id);if(t>c)o.push({k:'O:'+q.id,t,c:'n',ti:'Orden nueva · '+fd(q.etd),tx:ordTot(q)?hie(ordTot(q))+' · '+E([...new Set(q.lines.map(l=>l.city))].join(', ')):'Sin líneas todavía',go:'orden:'+q.id})});
 const pu=new Set();ST.O.forEach(m=>{const t=msS(m.u),i=pIx(m.pu);if(t>c&&i>=0&&!pu.has(m.pu)){pu.add(m.pu);o.push({k:'C:'+m.u,t,c:'d',ti:'Embarque cerrado · '+E(m.pn||ST.P[i].n),tx:'Informe de empaque listo para mandar por correo.',go:'emb:'+i})}});
